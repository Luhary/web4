<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIFlow</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-wrapper">
                <div class="logo">
                    AIFlow
                </div>

                <nav class="navigation">
                    <a href="#">Главная</a>
                    <a href="#">Возможности</a>
                    <a href="#">Отзывы</a>
                    <a href="#">Контакты</a>
                </nav>

                <button class="header-button">
                    Начать
                </button>
            </div>
        </div>
    </header>

    <section class="hero">
        <div class="container">
            <div class="hero-wrapper">
                <div class="hero-content">
                    <span class="hero-label">
                        AI ДЛЯ БИЗНЕСА
                    </span>

                    <h1>
                        Автоматизируйте процессы и экономьте время
                    </h1>

                    <p>
                        Используйте искусственный интеллект для обработки заявок, аналитики и поддержки клиентов.
                    </p>

                    <div class="hero-actions">
                        <button class="primary-button">
                            Попробовать бесплатно
                        </button>

                        <button class="secondary-button">
                            Подробнее
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
